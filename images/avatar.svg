<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
  <title id="title">Avatar — Wild Wonders</title>
  <desc id="desc">Circular avatar generated from site hero image.</desc>
  <defs>
    <clipPath id="circle-clip">
      <circle cx="200" cy="200" r="190" />
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#07130f" />
  <g clip-path="url(#circle-clip)">
    <image href="/IMG-20261017-WA3449.jpg" x="0" y="0" width="400" height="400" preserveAspectRatio="xMidYMid slice" />
  </g>
  <circle cx="200" cy="200" r="190" fill="none" stroke="#d9a44f" stroke-opacity="0.9" stroke-width="8" filter="url(#shadow)" />
</svg>
